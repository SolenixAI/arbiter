# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit: an independent second reviewer (another model) on every PR, free for public repos.
# It labels each PR from the list below, so labels stay few and meaningful.
language: en-CA
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  # Findings the creator overruled (AGENTS.md §10): recorded here so the review finds them no more.
  path_instructions:
    - path: "{AGENTS.md,README.md}"
      instructions: >-
        Overruled by the creator, do not flag: the `{problem..<solutions>..goal}` frontier notation
        is intentional and self-explanatory, with no definition line.
  suggested_labels: true
  auto_apply_labels: true
  labeling_instructions:
    - label: bug
      instructions: Fixes a rule, gate or file that was wrong.
    - label: enhancement
      instructions: Adds or improves a rule, skill or gate.
    - label: documentation
      instructions: Changes only wording, with no rule change.
  mutually_exclusive_groups:
    change_type: [bug, enhancement, documentation]
