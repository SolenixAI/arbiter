name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: every skill is model-invocable and matches the commit
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upstream skill packs mark some skills user-only. This restores them to model-invocable and
      # fails if any stays locked.
      - name: Unlock skills
        run: imples/unlock-skills.sh

      # Fails if the unlock changed a tracked skill: the committed files must already be unlocked.
      - name: Committed skills match the unlock
        run: git diff --exit-code .agents .claude

  gates:
    name: AGENTS.md gates pass and every diagram renders
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the experis tools
        run: npm ci

      # The experis tools are strict TypeScript, and each has node:test tests beside it.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # STE, triplets, 9-slot, PVI², pointers, no private ids.
      - name: Gates
        run: node experis/gates.ts --mermaid "$RUNNER_TEMP/mmd"

      # Each mermaid block must render, as GitHub shows it to readers.
      - name: Diagrams render
        run: |
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          for f in "$RUNNER_TEMP"/mmd/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@12.0.0 -q -p "$RUNNER_TEMP/puppeteer.json" -i "$f" -o "${f%.mmd}.svg"
          done
          find "$RUNNER_TEMP/mmd" -name '*.svg' | wc -l
