name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # GITHUB_TOKEN opens the release PR, and its events start no run. release-please.yml dispatches
  # this workflow on the release branch. A dispatch has no pull_request event, so the title is read
  # from the PR for that branch instead.
  workflow_dispatch:

permissions:
  pull-requests: read # read the PR title

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same types as the action's default, and the same header form: type(scope)!: subject
      - name: Check the PR title of the dispatched branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          title="$(gh pr view "$BRANCH" --json title --jq .title)"
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?: .+$'
          if [[ "$title" =~ $pattern ]]; then
            echo "PR title is a Conventional Commit: $title"
          else
            echo "::error::PR title is not a Conventional Commit: $title"
            exit 1
          fi
